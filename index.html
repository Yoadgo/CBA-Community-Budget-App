<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ניהול קהילה</title>

  <!-- גופן עברי נקי (Heebo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- העיצוב שלנו -->
  <link rel="stylesheet" href="css/style.css?v=20260818b" />
  <!-- שכבת מובייל — נטענת אחרי הבסיס כדי לעדכן היכן שצריך -->
  <link rel="stylesheet" href="css/mobile.css?v=20260818" />
  <!-- שכבת טעינה — שלדי shimmer, כניסת מסך רכה, טוסט "מעודכן" -->
  <link rel="stylesheet" href="css/loading.css?v=20260818" />
  <!-- אזור התושב — נגזר מהעיצוב, פונקציות מצומצמות -->
  <link rel="stylesheet" href="css/resident.css?v=20260818" />
  <!-- זכוכית נוזלית + תנועה (iOS 26) — שכבת עיצוב תוספתית, לא נוגעת במסכים -->
  <link rel="stylesheet" href="css/motion.css?v=20260818" />
  <!-- מכון כושר (2026-08-18) — שכבה ייעודית, כל המחלקות בתחילית gym- -->
  <link rel="stylesheet" href="css/gym.css?v=20260818c" />

  <!-- כניסת Google (Google Identity Services) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <!-- כותרת עליונה -->
  <header class="app-header">
    <div class="app-header__inner">
      <div class="app-brand">
        <div class="app-brand__logo">
          <svg width="22" height="22" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block" aria-hidden="true">
            <rect x="9"    y="21" width="7" height="13" rx="3.5" fill="currentColor"/>
            <rect x="20.5" y="12" width="7" height="22" rx="3.5" fill="currentColor"/>
            <rect x="32"   y="17" width="7" height="17" rx="3.5" fill="currentColor"/>
          </svg>
        </div>
        <div class="app-brand__text">
          <h1 class="app-brand__title">ניהול קהילה</h1>
        </div>
      </div>

      <!-- תפריט ניווט — באותה שורה של הכותרת.
           app-nav__viewport: 2026-08-08, "מכל" בלתי-נראה (בלי רקע/עיצוב משלו)
           שמתפקד כמסגרת-גלילה יציבה בדסקטופ בלבד — ר' ההערה המפורטת ב-
           style.css ליד .app-nav__viewport ואת placeNav ב-mobile.js. הכמוסה
           הוויזואלית עצמה (nav) ממשיכה "להתכווץ לפי תוכן" בדיוק כמו תמיד;
           רק המכל סביבה סופג את לחץ הפריסה, כדי שגדילת תוכן פנימי (למשל
           קבוצת-ניווט שנפתחת) לעולם לא תזיז את הכמוסה או תיצור מכל ריק גדול. -->
      <div class="app-nav__viewport" id="app-nav-viewport">
        <nav class="app-nav" id="app-nav">
          <button class="app-nav__tab is-active" data-screen="budget">תכנון מול ביצוע</button>
          <button class="app-nav__tab" data-screen="expenses">ניהול הוצאות</button>
          <button class="app-nav__tab" data-screen="planning">בניית תקציב</button>
        </nav>
      </div>

      <!-- מתג השנה — בין הניווט לכפתור המשתמש; מתמלא דינמית ב-app.js -->
      <div class="year-switch" id="year-switch"></div>

      <!-- חיווי "שומר…/נשמר ✓" — עוגן קבוע בכותרת (2026-08-09, לבקשת יועד: הועבר
           מבועה צפה בתחתית המסך, כי שם היה לא מספיק בולט). האלמנט עצמו
           (#cba-save-indicator) נוצר/מתעדכן ב-app.js (ר' saveIndicatorEl) ומוכנס
           לתוך העוגן הזה — לא לתוך app-controls, כדי שלא יתנגש עם renderControls()
           שכותב מחדש את כל ה-innerHTML של app-controls שוב ושוב (כפתור משתמש,
           התרעות). נשאר ריק/בלתי-נראה כשאין שמירה בעיצומה. -->
      <div class="save-indicator-slot" id="save-indicator-slot"></div>

      <!-- אזור בקרה ושמישות (פינה שמאלית עליונה) — נורות מצב, מתמלא ב-app.js -->
      <div class="app-controls" id="app-controls"></div>
    </div>
  </header>

  <!-- אזור התוכן — כאן כל מסך מצייר את עצמו -->
  <main class="app-main" id="app-main"></main>

  <!-- סדר הטעינה חשוב: קודם הנתונים, אחר כך המסכים, ולבסוף המנוע -->
  <!-- מניעת קאש ישן על טלפונים (2026-08-10, לבקשת יועד — אחרי שגילינו שבדיקת
       "תצוגת מובייל" הראתה עדיין את הגרסה הישנה של עץ הוועד, כי index.html
       טוען את קבצי ה-JS/CSS בלי שום cache-busting; ה-HTML עצמו כן מתעדכן
       מיד, אבל דפדפני מובייל (בעיקר Safari) שומרים גרסה ישנה של js/css עד
       שמישהו עושה רענון-מלא/מנקה קאש). ?v=YYYYMMDD בסוף כל קובץ מקומי (לא
       על ספריות חיצוניות כמו Google Fonts/GSI) — בכל דיפלוי עם שינוי אמיתי
       ב-JS/CSS, לעדכן את המספר הזה (לתאריך הדיפלוי) כדי לאלץ טעינה טרייה. -->
  <!-- לוגו — פונקציה עצמאית קטנה, נטענת מוקדם כי מסך הכניסה משתמש בה -->
  <script src="js/ui/logo.js?v=20260818"></script>
  <script src="js/data/mock.js?v=20260818"></script>
  <script src="js/data/dataService.js?v=20260818c"></script>
  <!-- חיבור ל-Google Sheets (קריאה). אם נכשל — נשארים על נתוני mock -->
  <script src="js/data/sheets.js?v=20260818"></script>
  <script src="js/screens/budget.js?v=20260818"></script>
  <script src="js/screens/expenses.js?v=20260818"></script>
  <!-- פנקס הערות (סעיף 1) — נטען לפני planning.js כי הלשונית שפותחת אותו יושבת שם -->
  <script src="js/screens/notes.js?v=20260818"></script>
  <script src="js/screens/planning.js?v=20260818"></script>
  <script src="js/screens/settings.js?v=20260818"></script>
  <script src="js/screens/clubAdmin.js?v=20260818"></script>
  <!-- מכון כושר — ניהול (2026-08-18). יושב ליד clubAdmin כי שניהם
       "מתקנים", אבל כל אחד עם מידור ההרשאות שלו. -->
  <script src="js/screens/gymAdmin.js?v=20260818c"></script>
  <script src="js/screens/residents.js?v=20260818c"></script>
  <!-- ניהול מיילים (שלב 1, 2026-08-18) — עריכת נוסח/תזמונים/הדלקה-כיבוי מהאפליקציה -->
  <script src="js/screens/emailSettings.js?v=20260818"></script>
  <!-- "שירותים לתושב" (2026-08-18). services.js קודם — הוא מגדיר את
       CBA.serviceUtils (פענוח הפורמט + ציור סעיף) ש-servicesAdmin.js תלוי בו. -->
  <script src="js/screens/services.js?v=20260818b"></script>
  <script src="js/screens/servicesAdmin.js?v=20260818b"></script>
  <!-- אזור התושב (מסכי הפורטל) — לפני המנוע -->
  <script src="js/screens/resident.js?v=20260818"></script>
  <script src="js/app.js?v=20260818c"></script>
  <!-- התנהגויות מובייל (בר תחתון, כותרת נעלמת) — אחרי המנוע -->
  <script src="js/ui/mobile.js?v=20260818"></script>
  <!-- זכוכית נוזלית + תנועה (iOS 26) — אפקטים בלבד, לא נוגע בנתונים/לוגיקה -->
  <script src="js/ui/motion.js?v=20260818"></script>
</body>
</html>
