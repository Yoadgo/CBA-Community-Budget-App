<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- PWA (2026-08-20) — "שמירה על מסך הבית". ר' מסמך אפיון PWA.
       manifest = תעודת הזהות של האפליקציה (שם, אייקון, מסך מלא).
       theme-color = צבע סרגל המערכת; זהה ל-CTA השחור של האפליקציה.
       apple-* = אייפון מתעלם מחלק מה-manifest וצריך את התגיות שלו. -->
  <link rel="manifest" href="manifest.webmanifest?v=20260909l" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="קהילה" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=20260909l" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=20260909l" />
  <title>ניהול קהילה</title>

  <!-- גופן עברי נקי (Heebo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- העיצוב שלנו -->
  <link rel="stylesheet" href="css/style.css?v=20260909l" />
  <!-- שכבת מובייל — נטענת אחרי הבסיס כדי לעדכן היכן שצריך -->
  <link rel="stylesheet" href="css/mobile.css?v=20260909l" />
  <!-- שכבת טעינה — שלדי shimmer, כניסת מסך רכה, טוסט "מעודכן" -->
  <link rel="stylesheet" href="css/loading.css?v=20260909l" />
  <!-- אזור התושב — נגזר מהעיצוב, פונקציות מצומצמות -->
  <link rel="stylesheet" href="css/resident.css?v=20260909l" />
  <!-- זכוכית נוזלית + תנועה (iOS 26) — שכבת עיצוב תוספתית, לא נוגעת במסכים -->
  <link rel="stylesheet" href="css/motion.css?v=20260909l" />
  <!-- מכון כושר (2026-08-18) — שכבה ייעודית, כל המחלקות בתחילית gym- -->
  <link rel="stylesheet" href="css/gym.css?v=20260909l" />
  <!-- PWA (2026-08-20) — שכבת ההסבר "הוספה למסך הבית" בלבד. כל המחלקות בתחילית pwa- -->
  <link rel="stylesheet" href="css/pwa.css?v=20260909l" />
  <!-- חיפוש גלובלי (2026-08-25) — כפתור הכותרת ושכבת החיפוש. כל המחלקות בתחילית gs- -->
  <link rel="stylesheet" href="css/search.css?v=20260909l" />
  <!-- עמוד הקבלה + רכיב מצב-ריק כלל-מערכתי (2026-08-27). מחלקות hm- ו-.empty -->
  <link rel="stylesheet" href="css/home.css?v=20260909l" />
  <!-- סיור היכרות (2026-08-28) — שכבה עצמאית, כל המחלקות בתחילית tr- -->
  <link rel="stylesheet" href="css/tour.css?v=20260909l" />
  <!-- "הפרטים שלי" (2026-08-28) — מחלקות pf- + כרטיס בקשות השינוי במסך התושבים -->
  <link rel="stylesheet" href="css/profile.css?v=20260909l" />
  <!-- "מראה שיכון" (2026-09-07) — מודול הגינון. כל המחלקות בתחילית gd- -->
  <link rel="stylesheet" href="css/garden.css?v=20260909l" />
  <!-- שכבת ה-Liquid Glass (2026-09-07). טוקנים + .lg + הרקע האמביינטי. -->
  <link rel="stylesheet" href="css/liquid-glass.css?v=20260909l" />

  <!-- כניסת Google (Google Identity Services) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <!-- כותרת עליונה -->
  <header class="app-header">
    <div class="app-header__inner">
      <div class="app-brand">
        <div class="app-brand__logo">
          <svg width="22" height="22" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block" aria-hidden="true">
            <rect x="9"    y="21" width="7" height="13" rx="3.5" fill="currentColor"/>
            <rect x="20.5" y="12" width="7" height="22" rx="3.5" fill="currentColor"/>
            <rect x="32"   y="17" width="7" height="17" rx="3.5" fill="currentColor"/>
          </svg>
        </div>
        <div class="app-brand__text">
          <h1 class="app-brand__title">ניהול קהילה</h1>
        </div>
      </div>

      <!-- תפריט ניווט — באותה שורה של הכותרת.
           app-nav__viewport: 2026-08-08, "מכל" בלתי-נראה (בלי רקע/עיצוב משלו)
           שמתפקד כמסגרת-גלילה יציבה בדסקטופ בלבד — ר' ההערה המפורטת ב-
           style.css ליד .app-nav__viewport ואת placeNav ב-mobile.js. הכמוסה
           הוויזואלית עצמה (nav) ממשיכה "להתכווץ לפי תוכן" בדיוק כמו תמיד;
           רק המכל סביבה סופג את לחץ הפריסה, כדי שגדילת תוכן פנימי (למשל
           קבוצת-ניווט שנפתחת) לעולם לא תזיז את הכמוסה או תיצור מכל ריק גדול. -->
      <div class="app-nav__viewport" id="app-nav-viewport">
        <nav class="app-nav" id="app-nav">
          <button class="app-nav__tab is-active" data-screen="budget">תכנון מול ביצוע</button>
          <button class="app-nav__tab" data-screen="expenses">ניהול הוצאות</button>
          <button class="app-nav__tab" data-screen="planning">בניית תקציב</button>
        </nav>
      </div>

      <!-- מתג השנה — בין הניווט לכפתור המשתמש; מתמלא דינמית ב-app.js -->
      <div class="year-switch" id="year-switch"></div>

      <!-- חיווי "שומר…/נשמר ✓" — עוגן קבוע בכותרת (2026-08-09, לבקשת יועד: הועבר
           מבועה צפה בתחתית המסך, כי שם היה לא מספיק בולט). האלמנט עצמו
           (#cba-save-indicator) נוצר/מתעדכן ב-app.js (ר' saveIndicatorEl) ומוכנס
           לתוך העוגן הזה — לא לתוך app-controls, כדי שלא יתנגש עם renderControls()
           שכותב מחדש את כל ה-innerHTML של app-controls שוב ושוב (כפתור משתמש,
           התרעות). נשאר ריק/בלתי-נראה כשאין שמירה בעיצומה. -->
      <div class="save-indicator-slot" id="save-indicator-slot"></div>

      <!-- אזור בקרה ושמישות (פינה שמאלית עליונה) — נורות מצב, מתמלא ב-app.js -->
      <div class="app-controls" id="app-controls"></div>
    </div>
  </header>

  <!-- אזור התוכן — כאן כל מסך מצייר את עצמו -->
  <main class="app-main" id="app-main"></main>

  <!-- סדר הטעינה חשוב: קודם הנתונים, אחר כך המסכים, ולבסוף המנוע -->
  <!-- מניעת קאש ישן על טלפונים (2026-08-10, לבקשת יועד — אחרי שגילינו שבדיקת
       "תצוגת מובייל" הראתה עדיין את הגרסה הישנה של עץ הוועד, כי index.html
       טוען את קבצי ה-JS/CSS בלי שום cache-busting; ה-HTML עצמו כן מתעדכן
       מיד, אבל דפדפני מובייל (בעיקר Safari) שומרים גרסה ישנה של js/css עד
       שמישהו עושה רענון-מלא/מנקה קאש). ?v=YYYYMMDD בסוף כל קובץ מקומי (לא
       על ספריות חיצוניות כמו Google Fonts/GSI) — בכל דיפלוי עם שינוי אמיתי
       ב-JS/CSS, לעדכן את המספר הזה (לתאריך הדיפלוי) כדי לאלץ טעינה טרייה. -->
  <!-- לוגו — פונקציה עצמאית קטנה, נטענת מוקדם כי מסך הכניסה משתמש בה -->
  <script src="js/ui/logo.js?v=20260909l"></script>
  <!-- חלונות האפליקציה (2026-08-19) — מחליף את window.alert/confirm/prompt.
       נטען לפני המסכים כי הם משתמשים ב-CBA.ui. -->
  <script src="js/ui/dialog.js?v=20260909l"></script>
  <script src="js/ui/security.js?v=20260909l"></script>
  <!-- שלדי טעינה (2026-08-25) — נטען לפני המסכים, כולם קוראים ל-CBA.skel -->
  <script src="js/ui/skeleton.js?v=20260909l"></script>
  <!-- חיפוש גלובלי (2026-08-25) — נשען על CBA.navTargets/CBA.data בזמן ריצה בלבד -->
  <script src="js/ui/search.js?v=20260909l"></script>
  <script src="js/data/mock.js?v=20260909l"></script>
  <script src="js/data/dataService.js?v=20260909l"></script>
  <!-- חיבור ל-Google Sheets (קריאה). אם נכשל — נשארים על נתוני mock -->
  <script src="js/data/sheets.js?v=20260909l"></script>
  <script src="js/screens/budget.js?v=20260909l"></script>
  <script src="js/screens/expenses.js?v=20260909l"></script>
  <!-- פנקס הערות (סעיף 1) — נטען לפני planning.js כי הלשונית שפותחת אותו יושבת שם -->
  <script src="js/screens/notes.js?v=20260909l"></script>
  <script src="js/screens/planning.js?v=20260909l"></script>
  <script src="js/screens/clubAdmin.js?v=20260909l"></script>
  <!-- מכון כושר — ניהול (2026-08-18). יושב ליד clubAdmin כי שניהם
       "מתקנים", אבל כל אחד עם מידור ההרשאות שלו. -->
  <script src="js/screens/gymAdmin.js?v=20260909l"></script>
  <!-- מכון כושר — מסך התושב והאשף (2026-08-19). אחרי gymAdmin, לפני המנוע. -->
  <script src="js/screens/resGym.js?v=20260909l"></script>
  <script src="js/screens/residents.js?v=20260909l"></script>
  <!-- ניהול מיילים (שלב 1, 2026-08-18) — עריכת נוסח/תזמונים/הדלקה-כיבוי מהאפליקציה -->
  <script src="js/screens/emailSettings.js?v=20260909l"></script>
  <!-- "שירותים לתושב" (2026-08-18). services.js קודם — הוא מגדיר את
       CBA.serviceUtils (פענוח הפורמט + ציור סעיף) ש-servicesAdmin.js תלוי בו. -->
  <script src="js/screens/services.js?v=20260909l"></script>
  <script src="js/screens/servicesAdmin.js?v=20260909l"></script>
  <!-- אזור התושב (מסכי הפורטל) — לפני המנוע -->
  <!-- גיאומטריית מפת השיכון — נוצר אוטומטית מקובץ הכיול, אל תערוך ידנית -->
  <script src="js/data/mapGeo.js?v=20260909l"></script>
  <script src="js/data/gardenAreas.js?v=20260909l"></script>
  <!-- מילון הגינון (2026-09-09) — שם אחד לכל מושג ומשפט מצב יחיד.
       נטען לפני כל מסכי הגינון; הם קוראים אותו בזמן ריצה. -->
  <script src="js/data/gardenLang.js?v=20260909l"></script>
  <script src="js/screens/resident.js?v=20260909l"></script>
  <!-- עמוד הקבלה (2026-08-27) — אחרי resident.js: הוא נשען על CBA.residentUtils
       שמוגדר שם, ועל CBA.skel/CBA.ui שנטענו קודם. -->
  <script src="js/screens/home.js?v=20260909l"></script>
  <!-- "הפרטים שלי" (2026-08-28) — נשען על CBA.skel ו-CBA.ui שנטענו קודם -->
  <script src="js/screens/myProfile.js?v=20260909l"></script>
  <!-- "מראה שיכון" (2026-09-07) — נטען **אחרי** resident.js: הוא נשען על
       CBA.map שמוגדר שם. ר' ההערה בראש הרכיב. -->
  <script src="js/screens/resGarden.js?v=20260909l"></script>
  <script src="js/screens/gardenPlan.js?v=20260909l"></script>
  <script src="js/screens/gardenStats.js?v=20260909l"></script>
  <script src="js/screens/gardenTasks.js?v=20260909l"></script>
  <!-- סיור היכרות (2026-08-28) — אחרי home.js (הכרטיס "יש חדש" קורא ל-CBA.tour)
       ולפני app.js, שמחווט את פריט התפריט ואת הפתיחה האוטומטית. -->
  <script src="js/ui/tour.js?v=20260909l"></script>
  <script src="js/app.js?v=20260909l"></script>
  <!-- התנהגויות מובייל (בר תחתון, כותרת נעלמת) — אחרי המנוע -->
  <script src="js/ui/mobile.js?v=20260909l"></script>

  <script src="js/ui/motion.js?v=20260909l"></script>
  <!-- PWA (2026-08-20) — רישום Service Worker, רענון גרסה, וכפתור ההתקנה.
       נטען אחרון: הוא נשען על CBA.ui, CBA.sheets ו-CBA.userIsEditingMain. -->
  <script src="js/pwa.js?v=20260909l"></script>
